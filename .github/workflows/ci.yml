name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, dead code, tests, security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -c requirements.txt -e ".[dev]"
      - name: requirements.txt matches pyproject.toml
        run: |
          pip-compile --quiet --strip-extras --output-file requirements.txt pyproject.toml
          git diff --exit-code -- requirements.txt
      - name: Lint (Ruff)
        run: |
          ruff check app.py pages incident_suite eval tests sample_logs
          ruff format --check app.py pages incident_suite eval tests sample_logs
      - name: Types (mypy)
        run: mypy
      - name: Dead code (Vulture)
        run: vulture
      - name: Security (Bandit)
        run: bandit -q -c pyproject.toml -r app.py pages incident_suite eval
      - name: Tests (no API key)
        run: pytest --cov
      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
