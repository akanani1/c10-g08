name: Keep Streamlit awake

# Streamlit Community Cloud puts apps to sleep after ~12h without visitors.
# A plain HTTP ping doesn't count as a visit, so this opens the app in a real
# headless browser and clicks the wake-up button if the app is asleep.
#
# Setup: Settings -> Secrets and variables -> Actions -> Variables ->
#   New repository variable  STREAMLIT_APP_URL = https://<your-app>.streamlit.app

on:
  schedule:
    - cron: "17 * * * *" # every hour at :17 (off the hour to avoid queue delays)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  wake:
    name: Visit the app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.STREAMLIT_APP_URL }}
    steps:
      - name: Check URL is set
        id: check
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::STREAMLIT_APP_URL repo variable is not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install Playwright
        if: steps.check.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Open the app and wake it if asleep
        if: steps.check.outputs.skip != 'true'
        shell: python
        run: |
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, timeout=90_000, wait_until="domcontentloaded")
              page.wait_for_timeout(10_000)

              # The sleep page may render inside an iframe, so check every frame.
              clicked = False
              for frame in page.frames:
                  btn = frame.get_by_role("button", name="get this app back up")
                  if btn.count():
                      btn.first.click()
                      clicked = True
                      break

              if clicked:
                  print("App was asleep: clicked wake-up button, waiting for boot...")
                  page.wait_for_timeout(90_000)
              else:
                  print("App was awake: session opened.")
                  page.wait_for_timeout(20_000)

              print("Page title:", page.title())
              browser.close()
