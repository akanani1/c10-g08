[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-suite"
version = "0.1.0"
description = "Multi-agent DevOps incident analysis: upload ops logs, get fixes, checklists, Slack posts and JIRA tickets."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Team c10-g08" }]
keywords = ["langgraph", "langchain", "multi-agent", "devops", "sre", "streamlit", "slack", "jira"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Pydantic :: 2",
    "Topic :: System :: Monitoring",
]
# Runtime dependencies. This is the only place they are declared;
# pip-compile turns them into the pinned requirements.txt (see README).
dependencies = [
    "httpx>=0.28",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-openai>=1.7",
    "langgraph>=1.2",
    "langsmith>=0.14",
    "openai>=3.0",
    "pyarrow>=25",
    "pydantic>=2.14",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "streamlit>=1.65",
]

[project.optional-dependencies]
# Developer tooling: pip install -c requirements.txt -e ".[dev]"
dev = [
    "bandit[toml]>=1.9",
    "mypy>=2.4",
    "pip-audit>=2.10",
    "pip-tools>=7.6",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "types-pyyaml>=6.0",
    "ruff>=0.17",
    "vulture>=2.16",
]

[project.urls]
Repository = "https://github.com/akanani1/c10-g08"

# Flat layout: the package lives at the repo root (see "Repo layout" in docs/build-plan.md).
[tool.setuptools.packages.find]
include = ["incident_suite*"]

# Prompts travel with the package and load through importlib.resources.
[tool.setuptools.package-data]
"incident_suite.prompts" = ["*.md"]

# ---------------------------------------------------------------- Ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused imports and variables
    "I",        # import sorting
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "ARG",      # unused arguments
    "N",        # naming
    "S",        # bandit rules
    "PT",       # pytest style
    "RET",      # return statements
    "ERA",      # commented-out code
    "PL",       # pylint subset
    "RUF",
]
ignore = [
    "PLR2004",  # magic values in comparisons are fine in tests and bounds
    "PLR0911",  # early returns read better than nested branches in parsers
]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR2004", "PLR0913"]
"sample_logs/make_samples.py" = ["S311", "T201", "PLR0913"]
"eval/run_eval.py" = ["T201"]

[tool.ruff.format]
line-ending = "lf"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["app.py", "incident_suite", "eval", "tests", "sample_logs/make_samples.py"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib -m 'not live'"
markers = [
    "live: calls real external services; opt-in with `pytest -m live` (needs keys)",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["incident_suite"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

# ---------------------------------------------------------------- vulture
[tool.vulture]
# 80: unused imports, arguments and unreachable code. Pydantic fields would be false alarms at 60.
paths = ["app.py", "incident_suite", "eval", "tests", "sample_logs/make_samples.py"]
min_confidence = 80
# pytest markers and LangChain interface methods are called by the frameworks
ignore_names = ["pytestmark", "embed_documents", "embed_query"]
ignore_decorators = ["@field_validator", "@model_validator", "@pytest.fixture"]

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
